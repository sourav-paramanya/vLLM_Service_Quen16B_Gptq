# V-Code Pilot - Docker Compose Configuration
# Production deployment with GPU isolation and resource limits
# Hugging Face Transformers Edition

services:
  ba_llm:
    image: vllm/vllm-openai:latest
    container_name: ba_llm
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      # Default: download from Hugging Face into the persistent cache volume.
      # To use a locally downloaded model in ./hf_models instead, set:
      #   VLLM_MODEL=/hf_models/<your_model_folder>
      - MODEL_NAME=${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4}
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "7080:8080"
    volumes:
      - vllm-models:/root/.cache/huggingface
      - ./hf_models:/hf_models:rw
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 8589934592
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --max-model-len
      - "8192"
      - --tensor-parallel-size
      - "1"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/models', timeout=2).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - vllm-network

volumes:
  vllm-models:
    driver: local

networks:
  vllm-network:
    driver: bridge
