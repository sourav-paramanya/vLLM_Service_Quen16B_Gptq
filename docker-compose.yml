# V-Code Pilot - Docker Compose Configuration
# Production deployment with GPU isolation and resource limits
# Hugging Face Transformers Edition

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - MODEL_NAME=hugging-quants/Meta-Llama-3.1-8B-Instruct-GPTQ-INT4
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8080:8080"
    volumes:
      - vllm-models:/root/.cache/huggingface
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 8589934592
    command:
      - hugging-quants/Meta-Llama-3.1-8B-Instruct-GPTQ-INT4
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --max-model-len
      - "8192"
      - --tensor-parallel-size
      - "1"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - vllm-network

volumes:
  vllm-models:
    driver: local

networks:
  vllm-network:
    driver: bridge
